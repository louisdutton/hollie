name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install devenv
        run: nix profile install github:cachix/devenv/v2.2.2
      - name: Verify code and content without launching the game
        run: devenv tasks run hollie:verify
      - name: Require committed formatting
        run: git diff --exit-code
